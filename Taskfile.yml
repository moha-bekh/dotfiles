version: "3"

vars:
  FLAKE: "."

tasks:
  default:
    desc: List available tasks
    cmd: task --list

  nix:install:
    desc: Install Nix (Determinate Systems installer, flakes enabled) — run before anything else on a fresh machine
    cmd: curl --proto '=https' --tlsv1.2 -sSf -L https://install.determinate.systems/nix | sh -s -- install

  check:
    desc: Evaluate all flake outputs without building (fast syntax/eval check)
    cmd: nix flake check --no-build

  update:
    desc: Update all flake inputs (nixpkgs, home-manager, nix-darwin) and re-lock
    cmd: nix flake update

  # --- NixOS host: nixos-btw ---

  nixos:switch:
    desc: Apply the NixOS config (nixos-btw) to the running system
    cmd: sudo nixos-rebuild switch --flake "{{.FLAKE}}#nixos-btw"

  nixos:boot:
    desc: Build the NixOS config and set it for next boot, without switching now
    cmd: sudo nixos-rebuild boot --flake "{{.FLAKE}}#nixos-btw"

  nixos:test:
    desc: Build and switch NixOS config for this session only (reverts on reboot)
    cmd: sudo nixos-rebuild test --flake "{{.FLAKE}}#nixos-btw"

  # --- macOS host: macos (M1, aarch64-darwin) ---

  macos:bootstrap:
    desc: First-ever switch on a fresh Mac, before darwin-rebuild exists on PATH
    cmd: nix run nix-darwin -- switch --flake "{{.FLAKE}}#macos"

  macos:switch:
    desc: Apply the macOS config (use after macos:bootstrap has run once)
    cmd: sudo darwin-rebuild switch --flake "{{.FLAKE}}#macos"

  # --- Arch (or any non-NixOS Linux) host: arch-btw, user-level only ---

  arch:bootstrap:
    desc: First-ever home-manager switch on a fresh Arch install
    # -b backup: standalone home-manager (unlike the NixOS/darwin modules) has no
    # backupFileExtension option, so pre-existing dotfiles (e.g. ~/.bashrc) would
    # otherwise make the switch fail on conflict. This renames them to *.backup instead.
    cmd: nix run home-manager/release-26.05 -- switch -b backup --flake "{{.FLAKE}}#moha@arch-btw"

  arch:switch:
    desc: Apply the user config (use after arch:bootstrap has run once)
    # Same `nix run` form as arch:bootstrap: the standalone `home-manager` command
    # only ends up on PATH if the shell sources the Nix profile's session vars, which
    # isn't guaranteed on Arch — `nix run` sidesteps that entirely.
    cmd: nix run home-manager/release-26.05 -- switch -b backup --flake "{{.FLAKE}}#moha@arch-btw"
