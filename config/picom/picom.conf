# Compositor for oxwm (X11). Needed for any window transparency to render at
# all — without a compositor running, opacity settings in individual apps
# (e.g. ghostty's background-opacity) are ignored by X11.

backend = "glx";
vsync = true;

# Blur whatever shows through a transparent window (e.g. ghostty's
# background-opacity) so the wallpaper reads as blurred, not just dimmed.
blur-method = "dual_kawase";
blur-strength = 5;
blur-background = true;
blur-background-fixed = true;

blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

fading = false;
corner-radius = 0;

round-borders = 0;
